name: Publish synthetic KDF benchmark

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout benchmark repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload benchmark artifact only
        uses: actions/upload-pages-artifact@v3
        with:
          path: benchmark

      - name: Deploy benchmark artifact
        id: deployment
        uses: actions/deploy-pages@v4
