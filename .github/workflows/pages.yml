name: Publish synthetic KDF benchmark and Orbikt-care-A mobile preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public staging repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages site
        shell: bash
        run: |
          rm -rf _site
          mkdir -p _site
          cp -a benchmark/. _site/
          if [ -d mobile-preview ]; then
            mkdir -p _site/mobile-preview
            cp -a mobile-preview/. _site/mobile-preview/
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
