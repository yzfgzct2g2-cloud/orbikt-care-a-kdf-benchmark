name: Import Orbikt-care-A mobile QA preview

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/import-preview.yml

permissions:
  contents: write

jobs:
  import-preview:
    runs-on: ubuntu-latest
    env:
      PREVIEW_ZIP_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-f1fc-8206-b491-27d0f2f8f4fb/raw?se=2026-09-20T03%3A50%3A44Z&sp=r&sv=2026-02-06&sr=b&scid=b62db3a3-451b-5c51-b4aa-f87d934992e2&skoid=6980ab1e-b994-4668-84de-ad0444c9d08b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-19T19%3A11%3A24Z&ske=2026-09-20T19%3A11%3A24Z&sks=b&skv=2026-02-06&sig=dL/2L%2BmairsJyULxOD9pzTWQPEsGCsXLri5KIvsqDOw%3D"
    steps:
      - name: Checkout public staging repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download compiled preview artifact
        shell: bash
        run: |
          curl --fail --location --retry 2 --retry-delay 2 "$PREVIEW_ZIP_URL" -o preview.zip
          rm -rf mobile-preview
          mkdir -p mobile-preview
          unzip -q preview.zip -d mobile-preview
          test -f mobile-preview/index.html
          test -f mobile-preview/source-version.json
          test -f mobile-preview/manifest.webmanifest
          test -d mobile-preview/assets
          test -d mobile-preview/icons
          test ! -e mobile-preview/sw.js

      - name: Verify QA-only artifact metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path("mobile-preview/source-version.json").read_text(encoding="utf-8"))
          assert meta["source_repository"] == "yzfgzct2g2-cloud/Orbikt-care-A"
          assert meta["source_commit"] == "2400571fabf19505daa16a20bc28ba406e796b6a"
          assert meta["qa_preview_only"] is True
          assert meta["service_worker_enabled"] is False
          PY

      - name: Commit compiled preview only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile-preview
          if git diff --cached --quiet; then
            echo "Preview artifact already current."
            exit 0
          fi
          git commit -m "preview: publish Orbikt-care-A mobile QA build 2400571"
          git push origin HEAD:main
